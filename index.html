<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>NDA Analytics</title>
    <link rel="stylesheet" href="style.css?v=2.0">
    <style>
        /* Стили для защиты паролем */
        #password-protect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #000000 0%, #ffffff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        .password-container {
            text-align: center;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
            animation: fadeIn 0.8s ease-out;
        }

        .nda-text {
            font-size: 72px;
            font-weight: 900;
            color: #ff5014;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(255, 80, 20, 0.3);
            letter-spacing: 2px;
        }

        .password-input-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #password {
            padding: 18px 20px;
            font-size: 18px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        #password:focus {
            border-color: #ff5014;
            box-shadow: 0 0 0 3px rgba(255, 80, 20, 0.2);
            background: rgba(255, 255, 255, 0.12);
        }

        #password::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .password-input-container button {
            padding: 18px 20px;
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(135deg, #ff5014 0%, #e03a00 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .password-input-container button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 80, 20, 0.3);
        }

        .password-input-container button:active {
            transform: translateY(0);
        }

        .password-hint {
            margin-top: 20px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            height: 20px;
            transition: all 0.3s ease;
        }

        .password-hint.success {
            color: #4CAF50;
        }

        .password-hint.error {
            color: #ff5252;
        }

        /* Анимации */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            10%,
            30%,
            50%,
            70%,
            90% {
                transform: translateX(-5px);
            }

            20%,
            40%,
            60%,
            80% {
                transform: translateX(5px);
            }
        }

        @media (max-width: 768px) {
            .password-container {
                padding: 30px 20px;
                width: 85%;
            }

            .nda-text {
                font-size: 56px;
                margin-bottom: 25px;
            }

            #password,
            .password-input-container button {
                padding: 16px;
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            .nda-text {
                font-size: 48px;
            }

            .password-container {
                padding: 25px 15px;
            }
        }
    </style>
</head>

<body>
    <!-- ЗАЩИТА ПАРОЛЕМ -->
    <div id="password-protect">
        <div class="password-container">
            <div id="password-animation"></div>
            <div class="password-input-container">
                <input type="password" id="password" placeholder="Введите пароль" autocomplete="off"
                    onkeypress="if(event.key === 'Enter') checkPassword()">
                <button onclick="checkPassword()">Войти в NDA</button>
            </div>
            <div class="password-hint" id="password-hint"></div>
        </div>
    </div>

    <!-- ГЛАВНЫЙ ЭКРАН -->
    <div class="container">
        <!-- Анимация NDA -->
        <div id="main"></div>

        <!-- Кнопки аналитики (скрыты изначально) -->
        <div class="buttons-container" id="buttons-container">
            <div class="buttons-row">
                <button class="portal-button" onclick="loadAnalytics('analytics1')">P&L Детализированный</button>
                <button class="portal-button" onclick="loadAnalytics('analytics2')">Аналитика по дням</button>
                <button class="portal-button" onclick="loadAnalytics('analytics2v2')">Аналитика по неделям</button>
                <button class="portal-button" onclick="loadAnalytics('analytics3')">Аналитика по месяцам</button>
            </div>
            <div class="buttons-row">
                <button class="portal-button" onclick="loadAnalytics('analytics4')">Сравнение юнитов</button>
                <button class="portal-button" onclick="loadAnalytics('analytics5')">Аналитика ключевых расходов</button>
                <button class="portal-button" onclick="loadAnalytics('analytics6')">Структура и показатели всей
                    сети</button>
            </div>
        </div>

        <!-- Подзаголовок (скрыт изначально) -->
        <div class="subtitle" id="subtitle">
            data-driven analytics from CFO's team
        </div>
    </div>

    <!-- КОНТЕЙНЕР ДЛЯ ЗАГРУЗКИ АНАЛИТИКИ -->
    <div id="analytics-container">
        <button class="back-button" onclick="returnToMain()">← Назад в NDA</button>
        <iframe id="analytics-frame" width="100%" height="100%" frameborder="0" title="Панель аналитики"></iframe>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="main.js?v=2.1"></script>
</body>

</html>
