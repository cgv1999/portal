<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аналитика по партнерам-франчайзи</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="controls">
            <h3>Аналитика по партнерам-франчайзи</h3>
        </div>

        <div class="filters" id="filters">
            <div class="filter-group">
                <label for="monthSelect">Период (месяцы):</label>
                <select id="monthSelect" multiple>
                    <!-- Месяцы будут заполнены динамически -->
                </select>
                <div class="filter-info">Ctrl+Click для выбора нескольких месяцев</div>
                <div class="selected-items" id="monthSelected">Все месяцы</div>
            </div>
            
            <div class="filter-group">
                <label for="objectSelect">Объект:</label>
                <select id="objectSelect" multiple>
                    <option value="">Все объекты</option>
                    <option value="all_retail">Вся розница</option>
                    <!-- Объекты будут добавлены динамически -->
                </select>
                <div class="filter-info">Ctrl+Click для выбора нескольких объектов</div>
                <div class="selected-items" id="objectSelected">Все</div>
            </div>
        </div>

        <div class="info" id="companyFileInfo">Используйте фильтры для настройки графика</div>
        <div class="stats" id="statsInfo"></div>
        <div id="companyChart">
            <div class="loading" id="chartLoading">Загрузка графика...</div>
        </div>
    </div>

</body>
</html>
