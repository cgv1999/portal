    <div class="container">

            <h3>Аналитика по партнерам-франчайзи</h3>

        <div class="filters" id="filters" style="display: none;">
            <div class="filter-group">
                <label for="monthSelect">Период (месяцы):</label>
                <select id="monthSelect" multiple>
                    <!-- Месяцы будут заполнены динамически -->
                </select>
                <div class="filter-info">Ctrl+Click для выбора нескольких месяцев</div>
                <div class="selected-items" id="monthSelected">Все месяцы</div>
            </div>
            
            <div class="filter-group">
                <label for="objectSelect">Объект (множественный выбор):</label>
                <select id="objectSelect" multiple>
                    <option value="">Все объекты</option>
                    <option value="all_franchise">Все франчайзи</option>
                    <!-- Объекты будут добавлены динамически -->
                </select>
                <div class="filter-info">Ctrl+Click для выбора нескольких объектов</div>
                <div class="selected-items" id="objectSelected">Все</div>
            </div>
            
            <div class="filter-group">
                <label for="addressSelect">Адреса (множественный выбор):</label>
                <select id="addressSelect" multiple>
                    <option value="">Все адреса</option>
                    <!-- Адреса будут добавлены динамически -->
                </select>
                <div class="filter-info">Ctrl+Click для выбора нескольких адресов</div>
                <div class="selected-items" id="addressSelected">Все</div>
            </div>
        </div>

        <div class="stats" id="statsInfo"></div>
        <div id="companyChart">

        </div>
    </div>
