<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аналитика по партнерам-франчайзи</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="controls">
            <h3>Аналитика по партнерам-франчайзи</h3>
        </div>

        <div class="filters" id="filters" style="display: none;">
            <div class="filter-group">
                <label for="monthSelect">Период (месяцы):</label>
                <select id="monthSelect" multiple>
                    <!-- Месяцы будут заполнены динамически -->
                </select>
                <div class="filter-info">Ctrl+Click для выбора нескольких месяцев</div>
                <div class="selected-items" id="monthSelected">Все месяцы</div>
            </div>
            
            <div class="filter-group">
                <label for="objectSelect">Объект (множественный выбор):</label>
                <select id="objectSelect" multiple>
                    <option value="">Все объекты</option>
                    <option value="all_franchise">Все франчайзи</option>
                    <!-- Объекты будут добавлены динамически -->
                </select>
                <div class="filter-info">Ctrl+Click для выбора нескольких объектов</div>
                <div class="selected-items" id="objectSelected">Все</div>
            </div>
            
            <div class="filter-group">
                <label for="addressSelect">Адреса (множественный выбор):</label>
                <select id="addressSelect" multiple>
                    <option value="">Все адреса</option>
                    <!-- Адреса будут добавлены динамически -->
                </select>
                <div class="filter-info">Ctrl+Click для выбора нескольких адресов</div>
                <div class="selected-items" id="addressSelected">Все</div>
            </div>
        </div>

        <div class="info" id="companyFileInfo">Загрузка данных...</div>
        <div class="stats" id="statsInfo"></div>
        <div id="companyChart">
            <div class="loading" id="chartLoading">Загрузка графика...</div>
        </div>
    </div>

    <!-- Скрипт загрузки данных -->
    <script>
        // Переменная для данных франчайзи
        let royaltyData = [];
        
        // Загрузка данных из JSON файла
        function loadRoyaltyData() {
            console.log('Начало загрузки данных франчайзи...');
            
            // Загружаем данные из pnl_data.json (или royalty_data.json)
            fetch('pnl_data.json')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    royaltyData = data;
                    console.log('Данные франчайзи успешно загружены:', royaltyData.length, 'записей');
                    
                    // Проверяем структуру данных
                    if (royaltyData.length > 0) {
                        console.log('Пример записи:', royaltyData[0]);
                        
                        // Инициализируем аналитику
                        if (typeof initFranchiseAnalytics === 'function') {
                            initFranchiseAnalytics();
                        } else {
                            console.error('Функция initFranchiseAnalytics не найдена!');
                        }
                    } else {
                        console.error('Данные франчайзи пусты');
                        document.getElementById('companyFileInfo').textContent = 'Ошибка: данные пусты';
                    }
                })
                .catch(error => {
                    console.error('Ошибка загрузки данных франчайзи:', error);
                    document.getElementById('companyFileInfo').textContent = 'Ошибка загрузки данных. Проверьте консоль.';
                    document.getElementById('chartLoading').textContent = 'Ошибка: не удалось загрузить данные';
                });
        }
        
        // Альтернативная функция для загрузки из встроенного JSON
        function loadInlineData() {
            // Если нужно использовать встроенные данные, раскомментируйте ниже
            /*
            royaltyData = [
                // Вставьте сюда JSON данные
            ];
            console.log('Встроенные данные загружены:', royaltyData.length, 'записей');
            if (typeof initFranchiseAnalytics === 'function') {
                initFranchiseAnalytics();
            }
            */
        }
        
        // Запускаем загрузку данных при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM загружен, начинаем загрузку данных...');
            
            // Загружаем данные из файла
            loadRoyaltyData();
            
            // Или используем встроенные данные (раскомментируйте если нужно)
            // loadInlineData();
        });
    </script>
    
    <!-- Основной скрипт аналитики -->
    <script src="script.js"></script>
</body>
</html>
