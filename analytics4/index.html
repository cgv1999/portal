<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сравнение юнитов по неделям</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="controls">
            <h3>Сравнение юнитов по неделям</h3>
        </div>
        
        <div class="filters" id="filters" style="display: none;">
            <div class="filter-group">
                <label for="weekSelect">Недели (множественный выбор):</label>
                <select id="weekSelect" multiple>
                    <option value="all">Все недели</option>
                </select>
                <div class="filter-info">Ctrl+Click для выбора нескольких недель</div>
                <div class="selected-items" id="weekSelected">Все</div>
            </div>
            <div class="filter-group">
                <label for="addressSelect">Юниты (адреса) - множественный выбор:</label>
                <select id="addressSelect" multiple>
                    <option value="all">Все юниты</option>
                    <!-- Розничные адреса -->
                    <option value="ДМИТРОВСКОЕ">ДМИТРОВСКОЕ</option>
                    <option value="ПЯТНИЦКОЕ">ПЯТНИЦКОЕ</option>
                    <option value="Пятницкое шоссе 20">Пятницкое шоссе 20</option>
                    <option value="ХИМКИ">ХИМКИ</option>
                    <option value="ШЕРЕМЕТЬЕВСКАЯ">ШЕРЕМЕТЬЕВСКАЯ</option>
                    <option value="МИЧУРИНСКИЙ">МИЧУРИНСКИЙ</option>
                    <option value="ЛОБАЧЕВСКОГО 37">ЛОБАЧЕВСКОГО 37</option>
                    <option value="ЛОБАЧЕВСКОГО 92">ЛОБАЧЕВСКОГО 92</option>
                    <option value="ЛОБАЧЕВСКОГО 19">ЛОБАЧЕВСКОГО 19</option>
                    <option value="РУБЛЕВКА91">РУБЛЕВКА91</option>
                    <option value="РУБЛЕВСКОЕ вл.4">РУБЛЕВСКОЕ вл.4</option>
                    <option value="Минская">Минская</option>
                    <option value="ПРАВОБЕРЕЖНАЯ">ПРАВОБЕРЕЖНАЯ</option>
                    <option value="Носовихинское">Носовихинское</option>
                    <option value="Пр Мира 94 А">Пр Мира 94 А</option>
                    <option value="ТТК">ТТК</option>
                    <option value="МЫТИЩИ">МЫТИЩИ</option>
                    <option value="ПЛЕЩЕЕВА">ПЛЕЩЕЕВА</option>
                    <option value="ВЕРНАДСКОГО">ВЕРНАДСКОГО</option>
                    <option value="НОВОЯСЕНЕВСКИЙ">НОВОЯСЕНЕВСКИЙ</option>
                    <option value="ПРОФСОЮЗНАЯ">ПРОФСОЮЗНАЯ</option>
                    <option value="Дзержинский, Угрешская">Дзержинский, Угрешская</option>
                    <option value="ЗАГОРОДНОЕ">ЗАГОРОДНОЕ</option>
                    <option value="ПРИВОЛЬНАЯ">ПРИВОЛЬНАЯ</option>
                    <option value="ЛЮБЛИНСКАЯ 135">ЛЮБЛИНСКАЯ 135</option>
                    <option value="Каспийская">Каспийская</option>
                    <option value="КАШИРСКОЕ 24">КАШИРСКОЕ 24</option>
                    <option value="Коломенский пр-д">Коломенский пр-д</option>
                    <option value="ВДНХ">ВДНХ</option>
                    <option value="Куликовская">Куликовская</option>
                    <option value="Чертановская">Чертановская</option>
                    <option value="СПб, Маршала Жукова">СПб, Маршала Жукова</option>
                    <option value="ПАПЕРНИКА вл.22">ПАПЕРНИКА вл.22</option>
                    <option value="ПРИШВИНА">ПРИШВИНА</option>
                    <option value="СЕРПУХОВ">СЕРПУХОВ</option>
                    <!-- Команды -->
                    <option value="Команда маркетинга и продаж франшизы">Команда маркетинга и продаж франшизы</option>
                    <option value="Развитие">Развитие</option>
                    <option value="Команда розницы франшиз">Команда розницы франшиз</option>
                    <option value="Команда автономности">Команда автономности</option>
                    <option value="Команда распространения (монтажи)">Команда распространения (монтажи)</option>
                    <option value="Команда маркетинга">Команда маркетинга</option>
                    <option value="Команда качество">Команда качество</option>
                    <option value="Команда заботы">Команда заботы</option>
                    <option value="Команда закупок, снабжения и логистики">Команда закупок, снабжения и логистики</option>
                    <option value="Команда HR и КДП">Команда HR и КДП</option>
                    <option value="Команда юристов">Команда юристов</option>
                    <option value="Команда бухгалтерии">Команда бухгалтерии</option>
                    <option value="Команда финансов">Команда финансов</option>
                </select>
                <div class="filter-info">Ctrl+Click для выбора нескольких юнитов</div>
                <div class="selected-items" id="addressSelected">Все</div>
            </div>
        </div>
        
        <div class="info" id="companyFileInfo">Анализ финансовых показателей по неделям</div>
        <div class="stats" id="statsInfo"></div>
        <div id="companyChart"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
